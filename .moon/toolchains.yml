# yaml-language-server: $schema=https://moonrepo.dev/schemas/toolchains.json
# Keep `rust.version` in step with the toolchain pinned in .github/workflows/ci.yml.
rust:
  version: "1.98.1"
  components: [clippy, rustfmt]

node:
  version: "26.10.0"
  packageManager: pnpm
  syncProjectWorkspaceDependencies: true

pnpm:
  version: "11.22.0"
