# yaml-language-server: $schema=./.engine/schema.config.json
#
# Changes to the generated GraphQL schema that the database cannot express, keyed by
# database object name. Everything here is optional: delete this file and graphpg still
# serves the whole schema.
version: "1.0"
schemas: [blog]
graphiql: true # development only

entities:
  authors:
    description: People who write posts and comments
    omit_operations: [delete] # no deleteAuthor mutation
  posts:
    columns:
      published_at: { description: When the post became visible to readers }
