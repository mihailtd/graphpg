# yaml-language-server: $schema=./graphpg.schema.json
#
# One file for every environment. Everything here is optional: delete it and graphpg still
# serves the whole schema of the database.
database:
  schemas: [blog]

graphql:
  enabled: true
  ui: true # the GraphiQL IDE; on by default only in dev mode, so the demo asks for it

openapi:
  enabled: true
  ui: true # the Scalar API reference; on by default only in dev mode, so the demo asks for it
  spec: true # the OpenAPI 3.1 document at /openapi.json; on by default only in dev mode

# What the database cannot express, keyed by database object name

entities:
  authors:
    description: People who write posts and comments
    omit_operations: [delete] # no deleteAuthor mutation
  posts:
    columns:
      published_at: { description: When the post became visible to readers }

# Safety limits, shared by GraphQL and REST (these are the defaults; `off` removes one)
# limits:
#   page_size: { default: 100, max: 1000 }
#   depth: 10
#   cost: 10000000
#   statement_timeout: 30s

# Pin the exported schemas: `graphpg schema export` writes them, `--check` verifies them in CI,
# and a drifted file stops a prod start (warns in dev). The files do not exist here, so nothing is pinned.
# export:
#   pin: fail
