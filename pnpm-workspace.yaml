packages:
  - e2e
  - packages/*

# Dependencies are installed once, up front (`pnpm install`, a CI step). By default pnpm also
# installs before each `pnpm run` / `pnpm exec` when they look stale; moon runs those in
# parallel, and the installs raced over node_modules on fresh checkouts (an esbuild postinstall
# lost its working directory, bins failed to link). Stale dependencies are an error instead.
verifyDepsBeforeRun: error

# esbuild (used by vitest and drizzle-kit) downloads its platform binary in a postinstall script
allowBuilds:
  esbuild: true

# drizzle-kit pins old esbuild versions (0.18, 0.25) that carry security advisories (< 0.28.1);
# it works with the current one. Drop once drizzle-kit ships with a patched esbuild.
overrides:
  esbuild: ^0.28.2
  # vitepress pins vite and markdown-it below their security fixes (vite < 8.3.3, markdown-it < 15.0.3).
  # Drop once vitepress ships with the patched versions.
  vite: ^8.3.3
  markdown-it: ^15.0.3
