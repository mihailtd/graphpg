name: Pages

# Builds and verifies the documentation site (packages/website: VitePress over docs/, README.md
# and CHANGELOG.md). Production deploys to Cloudflare Workers (wrangler.jsonc) via Workers Builds.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - README.md
      - CHANGELOG.md
      - Cargo.toml
      - packages/website/**
      - wrangler.jsonc
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  # Every pull request: `build` is a required check, so it must report on all of them
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one, a running deployment finishes
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # the "last updated" date of each page comes from git history
          fetch-depth: 0
      # v0.6.3, not v0.6.4: GitHub stopped serving v0.6.4's commit (261c62c) by SHA on 2026-10-15
      # (its tag still works). They differ only in the Node runtime (20 → 24).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      - run: pnpm install --frozen-lockfile
      - name: Build the site
        run: moon run website:build
        env:
          # the site is served at the root of graphpg.com; PAGES_BASE overrides it if needed
          SITE_BASE: ${{ vars.PAGES_BASE || '/' }}
          # the public address for canonical links and the sitemap; SITE_URL overrides it if needed
          SITE_URL: ${{ vars.SITE_URL || 'https://graphpg.com/' }}
          # Optional Search Console meta tag verification token
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
