name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call: # also run by the Publish workflow before anything is released

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/graphpg_test
  # The jobs that never serve the UI do not need it built (see crates/graphpg-ui/build.rs); the
  # ones that run the tests set it to 1.
  GRAPHPG_REQUIRE_UI: "0"
  # Line tables only: panics still name the file and line, and the forty-odd test binaries
  # fit the runner's disk (full debug info made the linker die with SIGBUS, out of space)
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Runners: `vars.CI_RUNS_ON` (the self-hosted runners when set), except for pull requests from
# forks, which always run on GitHub-hosted runners: a fork's code must never run on a machine of
# ours. Same-repository branches, main and the Publish workflow use CI_RUNS_ON.
#
# Caches: only runs on main write them (`save-if`), and pull requests read main's. A cache is
# readable from the branch that wrote it and from main only, so a PR that saved its own copies
# duplicated hundreds of MB per push that no other run could use, and the repository's 10 GB
# limit filled up and evicted the caches that mattered. Closed PRs are cleaned by cache-cleanup.yml.
jobs:
  # Cheap static checks first: typecheck, lint and formatting for both the Rust and TypeScript
  # parts. Everything below waits for them. Locally: `pnpm verify` (and `pnpm fix` to apply fixes).
  check:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      docker: ${{ steps.docker.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Self-hosted runners keep the build directory between jobs (checkout cleans `target`,
      # the link to the runner's cache survives as a fresh link)
      - if: runner.environment == 'self-hosted'
        run: ln -sfn "$CI_TARGET_CACHE" target
      # Whether this pull request touches what the image build depends on (see the `image` job).
      # Workflow files are not in the list: a change to them cannot break the Docker build.
      - id: docker
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|rust-toolchain\.toml|pnpm-(lock|workspace)\.yaml|package\.json|crates/[^/]+/(Cargo\.toml|build\.rs)|packages/[^/]+/package\.json)$'
          if git diff --name-only "$BASE...$HEAD" | grep -Eq "$pattern"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      # v0.6.3, not v0.6.4: GitHub stopped serving v0.6.4's commit (261c62c) by SHA on 2026-10-15
      # (its tag still works). They differ only in the Node runtime (20 → 24).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # Once, before any task: pnpm-workspace.yaml makes stale dependencies an error rather
      # than an install inside each of the tasks moon runs in parallel
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: moon run :typecheck :lint :format

  test:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: check
    permissions:
      contents: read
      packages: read
    services:
      # PostgreSQL 18 with the extensions graphpg integrates with (docker/test-pg)
      postgres:
        image: ghcr.io/${{ github.repository_owner }}/graphpg-test-pg:18
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphpg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d graphpg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # pg_duckdb on its own (tests/parquet.rs): its threads crash the server next to the pgrx
      # extensions of the image above
      duckdb:
        image: docker.io/pgduckdb/pgduckdb:18-v1.1.1
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DUCKDB_DATABASE_URL: postgres://postgres:postgres@localhost:5435/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Self-hosted runners keep the build directory between jobs (checkout cleans `target`,
      # the link to the runner's cache survives as a fresh link)
      - if: runner.environment == 'self-hosted'
        run: ln -sfn "$CI_TARGET_CACHE" target
      # v0.6.3, not v0.6.4: GitHub stopped serving v0.6.4's commit (261c62c) by SHA on 2026-10-15
      # (its tag still works). They differ only in the Node runtime (20 → 24).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # Once, before any task: pnpm-workspace.yaml makes stale dependencies an error rather
      # than an install inside each of the tasks moon runs in parallel
      - run: pnpm install --frozen-lockfile
      # The JavaScript build only: the Rust crates are compiled by the steps below, with the cache
      # restored (`graphpg-ui:build` would also compile them here, before the cache exists)
      - name: Build UI assets
        run: moon run graphiql-ui:build
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Create extensions
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/init.sql
      - name: Build
        run: cargo build --workspace --locked
        env:
          GRAPHPG_REQUIRE_UI: "1"
      - name: Test
        run: cargo test --workspace --locked
        env:
          GRAPHPG_REQUIRE_UI: "1"

  example:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: check
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d blog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-hosted runners keep the build directory between jobs (checkout cleans `target`,
      # the link to the runner's cache survives as a fresh link)
      - if: runner.environment == 'self-hosted'
        run: ln -sfn "$CI_TARGET_CACHE" target
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Load the blog example
        run: psql postgres://postgres:postgres@localhost:5432/blog -v ON_ERROR_STOP=1 -f examples/blog/schema.sql
      - name: The example schema follows graphpg's own advice
        working-directory: examples/blog
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/blog
        run: |
          cargo build --locked --manifest-path ../../Cargo.toml --bin graphpg
          advice=$(../../target/debug/graphpg advise)
          echo "$advice"
          ! grep -q '^warning:' <<< "$advice"
      - name: Serve it and run a query
        working-directory: examples/blog
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/blog
          PORT: "4000"
        run: |
          cargo run --locked --manifest-path ../../Cargo.toml --bin graphpg &
          for i in $(seq 1 120); do curl -sf localhost:4000/health && break; sleep 1; done
          curl -sf localhost:4000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ authors { username postsConnection { totalCount } } }"}' | tee /dev/stderr | grep -q '"username":"ada"'

  # End-to-end: Drizzle migrates and seeds PostgreSQL, then the built graphpg binary is queried.
  # moon installs the pinned Rust and Node toolchains (.moon/toolchains.yml) and orders the tasks.
  e2e:
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    needs: check
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphpg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d graphpg_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Self-hosted runners keep the build directory between jobs (checkout cleans `target`,
      # the link to the runner's cache survives as a fresh link)
      - if: runner.environment == 'self-hosted'
        run: ln -sfn "$CI_TARGET_CACHE" target
      # v0.6.3, not v0.6.4: GitHub stopped serving v0.6.4's commit (261c62c) by SHA on 2026-10-15
      # (its tag still works). They differ only in the Node runtime (20 → 24).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true
      # Once, before any task: pnpm-workspace.yaml makes stale dependencies an error rather
      # than an install inside each of the tasks moon runs in parallel
      - run: pnpm install --frozen-lockfile
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: moon run e2e:typecheck e2e:test

  # Builds the release image on pull requests (without pushing) so a broken Dockerfile is
  # caught before it reaches main, and checks that the container starts and serves.
  #
  # It runs only when a file the build depends on changed (the `docker` output of `check`): a
  # change to Rust or TypeScript sources cannot break the Docker build in a new way, and the
  # Publish workflow builds the image on every push to main anyway. It reads main's layer cache
  # (the amd64 scope of Publish), so the dependencies, the slow part, are not compiled again
  # unless the lockfile changed, and it writes no cache of its own.
  image:
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.docker == 'true'
    runs-on: ${{ fromJSON(github.event.pull_request.head.repo.fork != true && vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d blog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Self-hosted runners keep the build directory between jobs (checkout cleans `target`,
      # the link to the runner's cache survives as a fresh link)
      - if: runner.environment == 'self-hosted'
        run: ln -sfn "$CI_TARGET_CACHE" target
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: graphpg:ci
          cache-from: type=gha,scope=amd64
      - name: Load the blog example
        run: psql postgres://postgres:postgres@localhost:5432/blog -v ON_ERROR_STOP=1 -f examples/blog/schema.sql
      - name: Run the container
        run: |
          # Self-hosted runners keep their Docker state between jobs: a container of an earlier
          # run would hold the name
          docker rm -f graphpg >/dev/null 2>&1 || true
          docker run -d --name graphpg --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/blog \
            -v "$PWD/examples/blog/graphpg.yaml:/app/graphpg.yaml:ro" graphpg:ci
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
          curl -sf localhost:4000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ authors { username } }"}' | tee /dev/stderr | grep -q '"username":"ada"'
          # The GraphiQL UI is part of the image: its page names a script, which is served
          script=$(curl -sf localhost:4000/graphiql | grep -o '/graphiql/graphiql\.[A-Z0-9]*\.js')
          test -n "$script"
          curl -sf -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download} bytes of %{content_type}\n' "localhost:4000$script"
          docker stop --time 5 graphpg
          status=$(docker inspect graphpg --format '{{.State.ExitCode}}')
          docker rm graphpg >/dev/null
          test "$status" = "0"
