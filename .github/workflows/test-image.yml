# Builds and publishes the PostgreSQL the integration tests run against: PostgreSQL 18 with
# the extensions graphpg integrates with (docker/test-pg/Dockerfile).
#
#   push to main touching docker/test-pg/  ->  ghcr.io/<owner>/graphpg-test-pg:18
#   manual run (workflow_dispatch)         ->  the same
name: Test image

on:
  push:
    branches: [main]
    paths: ["docker/test-pg/**", ".github/workflows/test-image.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/test-pg
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository_owner }}/graphpg-test-pg:18
          push: true
          cache-from: type=gha,scope=test-pg
          cache-to: type=gha,scope=test-pg,mode=max
          provenance: false
          sbom: false
