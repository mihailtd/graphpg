# Builds and publishes the container image to the GitHub Container Registry.
#
#   push to main      ->  ghcr.io/<owner>/graphpg:sha-<short hash>  and  :edge
#   push tag vX.Y.Z   ->  :X.Y.Z, :X.Y, :X, :latest  (and :sha-<short hash>)
#                         plus a GitHub Release with generated notes
#
# To release: bump `version` in Cargo.toml, merge to main, then tag that commit:
#   git tag v1.3.0 && git push origin v1.3.0
# A tag must point at a commit on main and match the Cargo.toml version.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# A run in progress is never cancelled: the image build writes the layer cache that pull requests
# read only when it finishes, so cancelling it on the next merge meant the cache was never
# written while merges came faster than a build. A newer run waits (and replaces any older one
# that is still waiting), so main always ends with a finished build of its latest commit.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    # The test job pulls the test database image from the registry
    permissions:
      contents: read
      packages: read

  verify-tag:
    if: github.ref_type == 'tag'
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main and match the crate version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1
          fi
          crate="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1
          fi

  # Runners: `vars.CI_RUNS_ON` (as in CI; GitHub-hosted by default) for everything but the arm64
  # build, which needs a native arm runner: `vars.ARM_RUNS_ON`, else GitHub's (free for public
  # repositories only, so the arm64 image is built for public repositories). On self-hosted
  # runners without an arm one, `edge` images from main are amd64 only; a release still needs
  # arm64, and fails rather than publish half of it.
  plan:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
    steps:
      - id: p
        env:
          PRIVATE: ${{ github.event.repository.private }}
          RUNS_ON: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
          SELF_HOSTED: ${{ vars.CI_RUNS_ON != '' }}
          ARM_RUNS_ON: ${{ vars.ARM_RUNS_ON }}
          TAG: ${{ github.ref_type == 'tag' }}
        run: |
          platforms="[{\"platform\":\"linux/amd64\",\"runner\":${RUNS_ON},\"slug\":\"amd64\"}"
          arm="${ARM_RUNS_ON}"
          if [ -z "$arm" ] && { [ "$SELF_HOSTED" != "true" ] || [ "$TAG" = "true" ]; }; then
            arm='"ubuntu-24.04-arm"'
          fi
          if [ "$PRIVATE" != "true" ] && [ -n "$arm" ]; then
            platforms+=",{\"platform\":\"linux/arm64\",\"runner\":${arm},\"slug\":\"arm64\"}"
          fi
          echo "platforms=${platforms}]" >> "$GITHUB_OUTPUT"
          echo "platforms: ${platforms}]"

  # One native build per platform, pushed by digest (untagged) and scanned before any tag exists
  build:
    needs: [test, verify-tag, plan]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.verify-tag.result) }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }},mode=max
          provenance: false
          sbom: false
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The binary cache is saved under the GitHub-hosted runner's home (/home/runner), and
          # restores elsewhere on a self-hosted runner: install Trivy there instead
          cache: ${{ runner.environment == 'github-hosted' }}
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tag the per-platform images as one multi-arch image, and sign it
  merge:
    needs: build
    # verify-tag is skipped on branch pushes; without this, that skip would propagate through `build` and skip the merge too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto
      - name: Create the multi-platform image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: inspect
        run: |
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first"
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # cosign-installer runs envsubst (gettext-base), which GitHub's runners have and slimmer
      # self-hosted images may not
      - name: envsubst for cosign-installer
        run: command -v envsubst || { sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base; }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    if: github.ref_type == 'tag'
    needs: merge
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: write
    steps:
      # Through the API with the runner's Node: self-hosted runners have no `gh`
      - name: Create the GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        with:
          script: |
            const { TAG: tag, DIGEST: digest, IMAGE: image } = process.env;
            const version = tag.replace(/^v/, "");
            const fence = "```";
            const body = [
              "## Container image",
              "",
              `${fence}bash`,
              `docker pull ${image}:${version}`,
              fence,
              "",
              `Digest: \`${digest}\`. The image is signed with Sigstore:`,
              "",
              `${fence}bash`,
              `cosign verify ${image}@${digest} \\`,
              `  --certificate-identity-regexp '^https://github.com/${context.repo.owner}/${context.repo.repo}/' \\`,
              "  --certificate-oidc-issuer https://token.actions.githubusercontent.com",
              fence,
              "",
              "",
            ].join("\n");
            // GitHub's generated notes ("What's Changed", contributors, the full changelog link)
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo,
              tag_name: tag,
            });
            await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              name: `graphpg ${version}`,
              body: body + notes.body,
              prerelease: version.includes("-"),
            });
