# Builds and publishes the container image to the GitHub Container Registry.
#
#   push to main      ->  ghcr.io/<owner>/graphpg:sha-<short hash>  and  :edge
#   push tag vX.Y.Z   ->  :X.Y.Z, :X.Y, :X, :latest  (and :sha-<short hash>)
#                         plus a GitHub Release with generated notes
#
# To release: bump `version` in Cargo.toml, merge to main, then tag that commit:
#   git tag v1.0.1 && git push origin v1.0.1
# A tag must point at a commit on main and match the Cargo.toml version.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# A run in progress is never cancelled: the image build writes the layer cache that pull requests
# read only when it finishes, so cancelling it on the next merge meant the cache was never
# written while merges came faster than a build. A newer run waits (and replaces any older one
# that is still waiting), so main always ends with a finished build of its latest commit.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    # The test job pulls the test database image from the registry
    permissions:
      contents: read
      packages: read

  verify-tag:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag must be on main and match the crate version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main"; exit 1
          fi
          crate="v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$crate" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"; exit 1
          fi

  # arm64 runners are free for public repositories only: add that image when the repo is public
  plan:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.p.outputs.platforms }}
    steps:
      - id: p
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          platforms='[{"platform":"linux/amd64","runner":"ubuntu-latest","slug":"amd64"}'
          if [ "$PRIVATE" != "true" ]; then
            platforms+=',{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","slug":"arm64"}'
          fi
          echo "platforms=${platforms}]" >> "$GITHUB_OUTPUT"

  # One native build per platform, pushed by digest (untagged) and scanned before any tag exists
  build:
    needs: [test, verify-tag, plan]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.verify-tag.result) }}
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug }}
          cache-to: type=gha,scope=${{ matrix.slug }},mode=max
          provenance: false
          sbom: false
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tag the per-platform images as one multi-arch image, and sign it
  merge:
    needs: build
    # verify-tag is skipped on branch pushes; without this, that skip would propagate through `build` and skip the merge too
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with the workflow's OIDC identity
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=auto
      - name: Create the multi-platform image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
      - id: inspect
        run: |
          first=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$first"
          digest=$(docker buildx imagetools inspect "$first" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.inspect.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    if: github.ref_type == 'tag'
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          version="${TAG#v}"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          ## Container image

          \`\`\`bash
          docker pull ${IMAGE}:${version}
          \`\`\`

          Digest: \`${DIGEST}\`. The image is signed with Sigstore:

          \`\`\`bash
          cosign verify ${IMAGE}@${DIGEST} \\
            --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ## What's changed
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "graphpg ${version}" --notes-file notes.md --generate-notes $prerelease
