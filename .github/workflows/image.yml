# Builds the release image on a pull request (without publishing it) so a broken Dockerfile is
# caught before it reaches main, then starts the container and checks that it serves.
#
# It runs only when a file the build depends on changes: a change to Rust or TypeScript sources
# cannot break the Docker build in a new way, and Publish builds the image on every push to main.
#
# The layer cache lives in the container registry, shared with Publish: pull requests and main
# read and write the same cache, so whoever builds first (a pull request, usually) compiles the
# dependencies and everyone after reuses them. The GitHub Actions cache cannot do that, because
# a pull request's cache is invisible to main.
name: Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - crates/*/Cargo.toml
      - crates/*/build.rs
      - packages/*/package.json
      - .github/workflows/image.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # the layer cache is pushed to the registry
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d blog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: graphpg:ci
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:amd64
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache:amd64,mode=max
      - name: Load the blog example
        run: psql postgres://postgres:postgres@localhost:5432/blog -v ON_ERROR_STOP=1 -f examples/blog/schema.sql
      - name: Run the container
        run: |
          docker run -d --name graphpg --network host \
            -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/blog \
            -e DATABASE_SCHEMA=blog -e GRAPHIQL=true graphpg:ci
          for i in $(seq 1 30); do curl -sf localhost:4000/health && break; sleep 1; done
          curl -sf localhost:4000/graphql -H 'content-type: application/json' \
            -d '{"query":"{ authors { username } }"}' | tee /dev/stderr | grep -q '"username":"ada"'
          # The GraphiQL UI is part of the image: its page names a script, which is served
          script=$(curl -sf localhost:4000/graphiql | grep -o '/graphiql/graphiql\.[A-Z0-9]*\.js')
          test -n "$script"
          curl -sf -H 'Accept-Encoding: gzip' -o /dev/null -w '%{size_download} bytes of %{content_type}\n' "localhost:4000$script"
          docker stop --time 5 graphpg
          test "$(docker inspect graphpg --format '{{.State.ExitCode}}')" = "0"
