version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      npm: { patterns: ["*"], update-types: [minor, patch] }
    ignore:
      # GraphiQL (@graphiql/react) pins monaco-editor, and monaco-graphql supports < 0.53;
      # it moves when GraphiQL moves. 0.57 broke the UI build (#108).
      - dependency-name: monaco-editor
