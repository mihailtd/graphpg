version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      cargo: { patterns: ["*"], update-types: [minor, patch] }
