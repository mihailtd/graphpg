# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: rust
layer: application

dependsOn:
  - graphpg-ui

fileGroups:
  sources:
    - src/**/*
    - tests/**/*
    - Cargo.toml
    - /Cargo.toml
    - /Cargo.lock

tasks:
  dev:
    # run the server against DATABASE_URL (copy .env.example to .env); GraphiQL on, port 4000
    command: cargo run --locked --bin graphpg
    preset: server
    env:
      GRAPHIQL: "true"
    options:
      runFromWorkspaceRoot: true
  build:
    command: cargo build --locked -p graphpg
    deps:
      - graphpg-ui:build
    inputs: ["@globs(sources)"]
    outputs: [/target/debug/graphpg]
  test:
    # needs PostgreSQL: TEST_DATABASE_URL, or `docker compose up -d` in the repository root
    command: cargo test --locked -p graphpg
    deps:
      - graphpg-ui:build
    inputs: ["@globs(sources)"]
    options:
      cache: false
  typecheck:
    command: cargo check --locked -p graphpg --all-targets
    inputs: ["@globs(sources)"]
  lint:
    command: cargo clippy --locked -p graphpg --all-targets -- -D warnings
    inputs: ["@globs(sources)"]
  format:
    command: cargo fmt --check
    inputs: ["@globs(sources)"]
  fix:
    # apply rustfmt
    command: cargo fmt
    options:
      cache: false
