<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>graphpg · GraphiQL</title>
    <style>
      body {
        margin: 0;
      }

      #graphiql {
        height: 100dvh;
      }

      .loading {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4rem;
      }

      .sql-panel h3 {
        margin: 1rem 0 0.5rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        opacity: 0.7;
      }

      .sql-panel pre {
        margin: 0;
        padding: 0.75rem;
        overflow: auto;
        max-height: 45vh;
        font-family: var(--font-family-mono, ui-monospace, monospace);
        font-size: 12px;
        line-height: 1.45;
        white-space: pre;
        border-radius: 6px;
        background: hsla(var(--color-neutral, 219, 28%, 32%), 0.07);
      }

      .sql-panel .hint {
        opacity: 0.7;
        line-height: 1.5;
      }

      .sql-panel code {
        font-family: var(--font-family-mono, ui-monospace, monospace);
      }

      .sql-panel button {
        float: right;
        font: inherit;
        font-size: 0.75rem;
        cursor: pointer;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        border: 1px solid hsla(var(--color-neutral, 219, 28%, 32%), 0.3);
        background: transparent;
        color: inherit;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@5.4.0/dist/style.css"
      integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.5/dist/style.css"
      integrity="sha384-vTFGj0krVqwFXLB7kq/VHR0/j2+cCT/B63rge2mULaqnib2OX7DVLUVksTlqvMab"
      crossorigin="anonymous"
    />
    <!-- Import map and integrity hashes from GraphiQL's official CDN example (graphiql@5.4.0). -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/": "https://esm.sh/react@19.3.0/",
          "react-dom": "https://esm.sh/react-dom@19.3.0",
          "react-dom/": "https://esm.sh/react-dom@19.3.0/",
          "graphiql": "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.4.0/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.5?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        },
        "integrity": {
          "https://esm.sh/react@19.3.0": "sha384-gq3XRS6InsfZ3Lv6d+6mBuySvNkEX/1Ciw3jSlg9gL82444AmhVcwtYbpJfKbDqf",
          "https://esm.sh/react-dom@19.3.0": "sha384-xodfSorG86jrGERFAa4P/93Hfsvm7H8zpgSaybN6ruXaACScu/R7nOuoDgCfep8l",
          "https://esm.sh/graphiql@5.4.0": "sha384-moUMjxK/ZmHQE08otOtzYT/Zke32MqPb9l0uUXUdsf8aXl53LPYBciaAf9ON2nuR",
          "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql": "sha384-P5rs3WtMR+YUHbk+eUuomiB3Grin+04e9jKjuOY5KMBdjnl/qOUaCALfnVqVpIL8",
          "https://esm.sh/@graphiql/plugin-explorer@5.1.5": "sha384-hIrTiRjlICooYpU/kh97YrhFmYbV5WhIa37reJgertKXzyaM6kzkJaDUlQWs9+vb",
          "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid": "sha384-snSfFGTvNof5jyaw3xkRx7zsKRy9DWiljMvYXoo+zIwrhQv/h2pWOH81boYwk5P2",
          "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql": "sha384-+cNTwZgIW33q7A4E+ZoCMqzcXdfVIc2VthQvJ0uDpRXERBWYuDKPVMzvdQU8x48o",
          "https://esm.sh/graphql@17.0.2": "sha384-IPvlcmnvWT91sKqwbg9MxPXJUuPmSdwXCp22x6hcbBkAEhlfSKkMLR3v19K9iRUp"
        }
      }
    </script>
    <script type="module">
      import React from 'react';
      import ReactDOM from 'react-dom/client';
      import { GraphiQL, HISTORY_PLUGIN } from 'graphiql';
      import { createGraphiQLFetcher } from '@graphiql/toolkit';
      import { explorerPlugin } from '@graphiql/plugin-explorer';
      import 'graphiql/setup-workers/esm.sh';

      const h = React.createElement;

      // --- Debug extensions store ---------------------------------------------------
      // Holds `extensions` (sql / explain) from the latest non-introspection response,
      // which the server includes when started with --debug / --debug-explain.
      let lastDebug = null;
      const listeners = new Set();
      const debugStore = {
        get: () => lastDebug,
        set(value) {
          lastDebug = value;
          listeners.forEach((l) => l());
        },
        subscribe(listener) {
          listeners.add(listener);
          return () => listeners.delete(listener);
        },
      };

      async function debugFetch(url, init) {
        const response = await fetch(url, init);
        let operationName = null;
        try {
          operationName = JSON.parse(init?.body ?? '{}').operationName ?? null;
        } catch {}
        if (operationName !== 'IntrospectionQuery') {
          response
            .clone()
            .json()
            .then((json) => debugStore.set({ at: new Date(), extensions: json?.extensions ?? null }))
            .catch(() => {});
        }
        return response;
      }

      const fetcher = createGraphiQLFetcher({ url: '/graphql', fetch: debugFetch });

      // --- SQL plugin ------------------------------------------------------------------
      function CopyButton({ text }) {
        const [copied, setCopied] = React.useState(false);
        return h(
          'button',
          {
            type: 'button',
            onClick: () =>
              navigator.clipboard.writeText(text).then(() => {
                setCopied(true);
                setTimeout(() => setCopied(false), 1200);
              }),
          },
          copied ? 'Copied' : 'Copy',
        );
      }

      function Section({ title, text }) {
        return h(
          React.Fragment,
          null,
          h('h3', null, title, h(CopyButton, { text })),
          h('pre', null, text),
        );
      }

      function SqlPanel() {
        const state = React.useSyncExternalStore(debugStore.subscribe, debugStore.get);
        const ext = state?.extensions;

        let body;
        if (!state) {
          body = h('p', { className: 'hint' }, 'Run a query to see the SQL it compiles to.');
        } else if (!ext?.sql) {
          body = h(
            'p',
            { className: 'hint' },
            'The last response had no SQL debug info. Start the server with ',
            h('code', null, '--debug'),
            ' (SQL) or ',
            h('code', null, '--debug-explain'),
            ' (SQL + EXPLAIN ANALYZE). Introspection-only queries never hit the database.',
          );
        } else {
          const params = ext.sql.params ?? [];
          const explain = ext.explain;
          body = h(
            React.Fragment,
            null,
            h(Section, { title: 'SQL', text: ext.sql.query }),
            params.length > 0 &&
              h(Section, {
                title: 'Parameters',
                text: params.map((p, i) => `$${i + 1} = ${JSON.stringify(p)}`).join('\n'),
              }),
            explain &&
              h(Section, {
                title: 'EXPLAIN ANALYZE',
                text: Array.isArray(explain) ? explain.join('\n') : JSON.stringify(explain, null, 2),
              }),
          );
        }

        return h(
          'div',
          { className: 'sql-panel' },
          h('div', { className: 'graphiql-doc-explorer-title' }, 'SQL'),
          state && h('p', { className: 'hint' }, `Last request: ${state.at.toLocaleTimeString()}`),
          body,
        );
      }

      function DatabaseIcon() {
        return h(
          'svg',
          {
            viewBox: '0 0 24 24',
            fill: 'none',
            stroke: 'currentColor',
            strokeWidth: 1.5,
            strokeLinecap: 'round',
            strokeLinejoin: 'round',
            'aria-hidden': true,
          },
          h('ellipse', { cx: 12, cy: 5, rx: 8, ry: 3 }),
          h('path', { d: 'M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5' }),
          h('path', { d: 'M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3' }),
        );
      }

      const sqlPlugin = { title: 'SQL', icon: DatabaseIcon, content: SqlPanel };
      const plugins = [HISTORY_PLUGIN, explorerPlugin(), sqlPlugin];

      function App() {
        return h(GraphiQL, {
          fetcher,
          plugins,
          defaultEditorToolsVisibility: true,
        });
      }

      const container = document.getElementById('graphiql');
      const root = ReactDOM.createRoot(container);
      root.render(h(App));
    </script>
  </head>
  <body>
    <div id="graphiql">
      <div class="loading">Loading…</div>
    </div>
  </body>
</html>
