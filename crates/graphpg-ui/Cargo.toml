[package]
name = "graphpg-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["graphiql", "scalar"]
graphiql = []
scalar = ["dep:scalar_api_reference", "dep:serde_json"]

[dependencies]
axum = "0.8"
rust-embed = "8.12"
mime_guess = "2.0"
http = "1.2"
scalar_api_reference = { version = "0.2.11", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
