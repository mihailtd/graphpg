[package]
name = "graphpg-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The web UIs of graphpg (GraphiQL, Scalar), embedded in the binary"

[features]
default = ["graphiql", "scalar"]
graphiql = ["dep:rust-embed", "dep:flate2"]
scalar = ["dep:scalar_api_reference", "dep:serde_json"]

[dependencies]
axum = "0.8"
rust-embed = { version = "8.12", optional = true }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
scalar_api_reference = { version = "0.2.11", optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.45", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
