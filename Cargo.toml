[workspace]
resolver = "2"
members = [
  "crates/*"
]

[workspace.package]
version = "1.4.1"
edition = "2021"
license = "MIT OR Apache-2.0"

# Line tables only: panics and backtraces still name the file and line, at under half the size.
# For a debugger: CARGO_PROFILE_DEV_DEBUG=full cargo build
[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
