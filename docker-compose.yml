# PostgreSQL 18 with the extensions graphpg integrates with (docker/test-pg), for development and
# the test suite: the image CI runs the tests against. `docker compose build` builds it locally.
services:
  postgres:
    image: ghcr.io/mihailtd/graphpg-test-pg:18
    build: docker/test-pg
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphpg_test
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphpg_test"]
      interval: 5s
      timeout: 5s
      retries: 5
