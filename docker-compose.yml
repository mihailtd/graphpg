# PostgreSQL 18 with pgvector, for development and the test suite.
services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphpg_test
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphpg_test"]
      interval: 5s
      timeout: 5s
      retries: 5
